<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Footy — Guess Their Level</title>
  <meta name="description" content="Upload your clips. Let the world guess your level. The social guessing game for ballers.">
  <meta property="og:title" content="Footy — Guess Their Level">
  <meta property="og:description" content="Upload your clips. Let the world guess your level. Rec, academy, semi-pro, or pro?">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: { 400: '#a3e635', 500: '#84cc16' },
            dark: { 900: '#0a0a0a', 800: '#141414', 700: '#1e1e1e', 600: '#2a2a2a' }
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    /* ---- Gradient text ---- */
    .gradient-text {
      background: linear-gradient(135deg, #a3e635 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ---- App layout ---- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    @media (min-width: 640px) {
      #app { border-left: 1px solid #1e1e1e; border-right: 1px solid #1e1e1e; }
    }

    #app-header {
      flex-shrink: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(10,10,10,0.9);
      z-index: 40;
    }

    #view-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    #view-container::-webkit-scrollbar { display: none; }
    #view-container { scrollbar-width: none; }

    #tab-bar {
      flex-shrink: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(10,10,10,0.95);
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      border: none;
      background: none;
      color: #6b7280;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: #a3e635; }
    .tab-btn svg { width: 24px; height: 24px; }

    /* ---- Clip card ---- */
    .clip-card {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      overflow: hidden;
      margin: 12px;
      transition: transform 0.2s;
    }

    .clip-video-area {
      position: relative;
      width: 100%;
      aspect-ratio: 9/12;
      background: #0a0a0a;
      overflow: hidden;
    }
    .clip-video-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Demo clip animated placeholder */
    .demo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .demo-placeholder::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(163,230,53,0.1) 40px, rgba(163,230,53,0.1) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(163,230,53,0.1) 40px, rgba(163,230,53,0.1) 41px);
      animation: field-scroll 8s linear infinite;
    }
    @keyframes field-scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(41px); }
    }
    .demo-placeholder .demo-emoji {
      font-size: 64px;
      animation: demo-bounce 2s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }
    @keyframes demo-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }
    .demo-placeholder .demo-label {
      font-size: 13px;
      color: #6b7280;
      margin-top: 12px;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    /* Guess pills */
    .guess-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #d1d5db;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .guess-pill:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); }
    .guess-pill.selected {
      border-color: rgba(163,230,53,0.5);
      background: rgba(163,230,53,0.15);
      color: #a3e635;
    }
    .guess-pill .pill-emoji { font-size: 14px; }

    /* Lock-in button */
    .lock-in-btn {
      width: 100%;
      padding: 14px;
      border-radius: 9999px;
      border: none;
      background: #84cc16;
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .lock-in-btn:disabled {
      background: #2a2a2a;
      color: #6b7280;
      cursor: not-allowed;
    }
    .lock-in-btn:not(:disabled):hover { background: #a3e635; }

    /* Reveal animation */
    .reveal-container {
      animation: reveal-slide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes reveal-slide {
      0% { opacity: 0; transform: translateY(20px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .reveal-correct {
      animation: flash-green 0.6s ease;
    }
    @keyframes flash-green {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 40px rgba(163,230,53,0.4); }
    }

    .reveal-wrong {
      animation: flash-red 0.6s ease;
    }
    @keyframes flash-red {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 40px rgba(239,68,68,0.4); }
    }

    /* Vote bar */
    .vote-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* XP popup */
    .xp-popup {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      animation: xp-float 1.5s ease forwards;
      pointer-events: none;
    }
    @keyframes xp-float {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.9); }
    }

    /* Upload area */
    .upload-dropzone {
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-dropzone:hover, .upload-dropzone.drag-over {
      border-color: rgba(163,230,53,0.4);
      background: rgba(163,230,53,0.03);
    }
    .upload-dropzone.has-file {
      border-color: rgba(163,230,53,0.3);
      border-style: solid;
      padding: 12px;
    }

    /* Form elements */
    .form-input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: rgba(163,230,53,0.5); }
    .form-input::placeholder { color: #6b7280; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Level selector in upload */
    .level-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #1e1e1e;
      cursor: pointer;
      transition: all 0.2s;
    }
    .level-option:hover { border-color: rgba(255,255,255,0.15); }
    .level-option.selected {
      border-color: rgba(163,230,53,0.5);
      background: rgba(163,230,53,0.08);
    }
    .level-option .lo-emoji { font-size: 20px; }
    .level-option .lo-label { font-weight: 600; font-size: 14px; }
    .level-option .lo-desc { font-size: 12px; color: #6b7280; }
    .level-option .lo-check {
      margin-left: auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .level-option.selected .lo-check {
      border-color: #a3e635;
      background: #a3e635;
    }

    /* Leaderboard */
    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.2s;
    }
    .lb-row:hover { background: rgba(255,255,255,0.02); }
    .lb-rank {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .lb-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    /* Stats grid */
    .stat-card {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 24px;
    }
    .stat-label {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Onboarding modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modal-in {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Confetti particles */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 300;
    }
    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confetti-fall 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(200px) rotate(720deg) scale(0); opacity: 0; }
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    /* Smooth view transitions */
    .view-enter {
      animation: view-fade-in 0.25s ease;
    }
    @keyframes view-fade-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Play button overlay */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .play-overlay.hidden { opacity: 0; pointer-events: none; }
    .play-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-icon svg { width: 24px; height: 24px; fill: #0a0a0a; margin-left: 3px; }
  </style>
</head>
<body>

  <!-- ===== Onboarding Modal ===== -->
  <div id="onboarding-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="text-5xl mb-4">⚽</div>
      <h2 class="font-display font-bold text-2xl mb-2">Welcome to Footy</h2>
      <p class="text-gray-400 text-sm mb-6">Pick a name. Start guessing. Upload your clips.</p>
      <input
        type="text"
        id="onboard-name"
        placeholder="Enter your name"
        maxlength="20"
        class="form-input mb-4 text-center"
        autocomplete="off"
      >
      <button id="onboard-submit" class="lock-in-btn" disabled>Let's Go</button>
    </div>
  </div>

  <!-- ===== App Shell ===== -->
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚽</span>
        <span class="font-display font-bold text-lg tracking-tight">footy</span>
      </div>
      <div id="header-right" class="flex items-center gap-3">
        <div id="xp-display" class="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-full px-3 py-1">
          <span class="text-sm">🔥</span>
          <span class="text-xs font-bold text-lime-400" id="xp-count">0</span>
          <span class="text-xs text-gray-500">XP</span>
        </div>
        <div id="streak-display" class="flex items-center gap-1 bg-white/5 border border-white/10 rounded-full px-3 py-1">
          <span class="text-sm">⚡</span>
          <span class="text-xs font-bold text-cyan-400" id="streak-count">0</span>
        </div>
      </div>
    </header>

    <!-- Main View -->
    <div id="view-container"></div>

    <!-- Bottom Tab Bar -->
    <nav id="tab-bar">
      <button class="tab-btn active" data-view="feed" aria-label="Feed">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
        </svg>
        <span>Feed</span>
      </button>
      <button class="tab-btn" data-view="upload" aria-label="Upload">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
        </svg>
        <span>Upload</span>
      </button>
      <button class="tab-btn" data-view="leaderboard" aria-label="Leaderboard">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-4.5A3.375 3.375 0 0012.75 10.5h-.75a.75.75 0 01-.75-.75V6.75a3 3 0 00-3-3H6a3 3 0 00-3 3v3a.75.75 0 01-.75.75H1.5a3.375 3.375 0 00-3.375 3.375v4.5"/>
        </svg>
        <span>Board</span>
      </button>
      <button class="tab-btn" data-view="profile" aria-label="Profile">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
